name: Build Neva-Book Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source archive
        shell: powershell
        run: |
          if (-not (Test-Path "NevaBook_Native_1.1_Source.zip")) {
            Write-Error "Upload NevaBook_Native_1.1_Source.zip to the repository root first."
          }

      - name: Extract source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path buildsrc | Out-Null
          Expand-Archive -Path "NevaBook_Native_1.1_Source.zip" -DestinationPath buildsrc -Force
          Get-ChildItem buildsrc

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        working-directory: buildsrc/NevaBook_Native_1.1
        run: dotnet restore NevaBook.csproj

      - name: Publish portable EXE
        working-directory: buildsrc/NevaBook_Native_1.1
        shell: cmd
        run: >
          dotnet publish NevaBook.csproj -c Release -r win-x64 --self-contained true
          -p:PublishProfile=Portable -o publish\portable

      - name: Publish installed files
        working-directory: buildsrc/NevaBook_Native_1.1
        shell: cmd
        run: >
          dotnet publish NevaBook.csproj -c Release -r win-x64 --self-contained true
          -p:PublishProfile=Installed -o publish\installed

      - name: Prepare artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "buildsrc/NevaBook_Native_1.1/publish/portable/Neva-Book1.1.exe" "artifacts/Neva-Book1.1_Portable.exe"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        working-directory: buildsrc/NevaBook_Native_1.1
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Installer\NevaBook.iss'

      - name: Copy installer
        shell: powershell
        run: |
          $setup = Get-ChildItem -Path "buildsrc/NevaBook_Native_1.1" -Recurse -Filter "Neva-Book1.1_Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installer was not created." }
          Copy-Item $setup.FullName "artifacts/Neva-Book1.1_Setup.exe"

      - name: Upload ready Windows files
        uses: actions/upload-artifact@v4
        with:
          name: Neva-Book1.1-Windows
          path: |
            artifacts/Neva-Book1.1_Portable.exe
            artifacts/Neva-Book1.1_Setup.exe

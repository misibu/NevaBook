name: Amvera web image check
on:
  push:
    branches: [ 'deploy/amvera-web' ]
    paths:
      - 'web/**'
      - 'deploy/amvera-web.Dockerfile'
      - 'amvera.yml'
      - '.github/workflows/amvera-web-ci.yml'

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Amvera web image
        run: docker build -f deploy/amvera-web.Dockerfile -t neva-book-web:check .
